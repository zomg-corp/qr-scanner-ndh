name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      # strict, as the endticket admin compiles src/ under strict
      - run: yarn typecheck
      - run: yarn build
      # The sourcemaps are left out: the closure plugin names an identifier in them at random.
      - name: Committed bundles match the source
        run: git diff --exit-code -- . ':(exclude)*.map'
      - run: yarn test
